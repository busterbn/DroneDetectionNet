name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: drone-detection-mlops
  REGION: europe-north2
  COMPUTE_REGION: europe-west4
  ARTIFACT_REGISTRY: europe-north2-docker.pkg.dev/drone-detection-mlops/ml-containers

jobs:
  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build API image with Cloud Build
        run: |
          gcloud builds submit \
            --config cloud/cloudbuild-api.yaml \
            --substitutions=_TAG_NAME=${{ github.sha }} \
            --ignore-file cloud/ignore_configs/.gcloudignore-api

  deploy-api:
    needs: build-api-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Update image tag in config
        run: |
          sed -i 's|api:latest|api:${{ github.sha }}|' cloud/cloudrun-api.yaml

      - name: Deploy to Cloud Run
        run: uv run invoke deploy-api
