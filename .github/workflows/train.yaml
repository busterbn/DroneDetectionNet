name: Train Model

on:
  workflow_dispatch:

env:
  PROJECT_ID: drone-detection-mlops
  REGION: europe-north2
  COMPUTE_REGION: europe-west4
  ARTIFACT_REGISTRY: europe-north2-docker.pkg.dev/drone-detection-mlops/ml-containers

jobs:
  build-train-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build train image with Cloud Build
        run: |
          gcloud builds submit \
            --config cloud/cloudbuild-train.yaml \
            --substitutions=_TAG_NAME=${{ github.sha }} \
            --ignore-file cloud/ignore_configs/.gcloudignore-train

  train:
    needs: build-train-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Submit training job to Vertex AI
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          uv run invoke cloud-train

      - name: Regenerate reference dataset
        run: |
          # After training completes, regenerate the reference dataset
          # This keeps the drift monitoring baseline in sync with the latest model
          uv run python -m drone_detector_mlops.monitoring.generate_reference_dataset

      - name: Upload reference dataset to GCS
        run: |
          gcloud storage cp data/reference_dataset.csv gs://drone-detection-mlops-data/monitoring/
          gcloud storage cp data/reference_dataset.json gs://drone-detection-mlops-data/monitoring/
          echo "Reference dataset updated after training"
