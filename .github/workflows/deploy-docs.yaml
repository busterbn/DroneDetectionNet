name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
    contents: write

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Set up UV
      uses: astral-sh/setup-uv@v7

    - name: Install dev dependencies
      run: uv sync --group dev

    - name: Deploy docs
      run: uv run mkdocs gh-deploy --force -f docs/mkdocs.yaml
